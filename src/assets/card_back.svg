<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 170" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBackBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <pattern id="cardPattern" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M8 0 L16 8 L8 16 L0 8 Z" fill="none" stroke="#6366f1" stroke-width="0.8" stroke-opacity="0.4" />
      <circle cx="8" cy="8" r="1.5" fill="#a5b4fc" opacity="0.5" />
    </pattern>
  </defs>
  <!-- Card Base -->
  <rect x="2" y="2" width="116" height="166" rx="8" fill="url(#cardBackBg)" stroke="#818cf8" stroke-width="2.5" />
  <rect x="6" y="6" width="108" height="158" rx="6" fill="none" stroke="#a5b4fc" stroke-width="1" stroke-dasharray="4,2" opacity="0.6" />
  <!-- Pattern fill -->
  <rect x="10" y="10" width="100" height="150" rx="4" fill="url(#cardPattern)" />
  <!-- Center Emblem -->
  <circle cx="60" cy="85" r="22" fill="#1e1b4b" stroke="#f59e0b" stroke-width="2" />
  <text x="60" y="91" font-family="sans-serif" font-size="20" font-weight="bold" fill="#fbbf24" text-anchor="middle">S</text>
</svg>
